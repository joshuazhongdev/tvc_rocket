; PlatformIO Project Configuration File
;
; TWO ENVIRONMENTS, ONE FOR EACH USB CONNECTOR ON THE DEVKITC-1.
;
; The board has two USB sockets and they are NOT interchangeable:
;
;   [env:uart]  the CH340 bridge, shows up as /dev/cu.wchusbserial*
;               Serial goes to UART0. The bridge chip holds the port open no
;               matter what the ESP32 does, so the monitor survives resets and
;               brownouts. This is the better bench port. DEFAULT.
;
;   [env:usb]   the ESP32-S3's own USB, shows up as /dev/cu.usbmodem*
;               Needs ARDUINO_USB_CDC_ON_BOOT=1 or Serial goes to UART0 and the
;               USB monitor stays silent. The port vanishes on every reset and
;               re-enumerates under a new number. Use only if the UART socket
;               is unreachable once the board is mounted.
;
; Getting these crossed gives you a board that uploads, runs, and prints
; nothing: the ROM bootloader banner appears and then silence. If that happens,
; you are monitoring the socket the firmware is not printing to.
;
;   pio run -t upload -t monitor            -> uart (default)
;   pio run -e usb -t upload -t monitor     -> native USB

[platformio]
default_envs = uart

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters =
    direct
    send_on_enter
lib_deps =
    madhephaestus/ESP32Servo
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
lib_ldf_mode = deep

[env:uart]
upload_port = /dev/cu.wchusbserial*
monitor_port = /dev/cu.wchusbserial*
; No USB CDC flags on purpose. Serial must stay on UART0 for this socket.

[env:usb]
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
