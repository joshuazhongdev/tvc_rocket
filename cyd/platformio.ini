; ---------------------------------------------------------------------------
; TVC handset - ESP32-2432S028R, the "Cheap Yellow Display".
;
; A SEPARATE PROJECT from the rocket on purpose. Different chip (plain ESP32,
; not S3), different pins, different job. Build and upload it on its own:
;
;     cd cyd
;     pio run -t upload -t monitor
;
; The board is a bare ESP32-WROOM-32 with a display bolted on, so board =
; esp32dev is correct. There is no CYD board definition and you do not need
; one; every pin the display uses is declared in src/main.cpp.
;
; LovyanGFX rather than TFT_eSPI. TFT_eSPI wants its pin map edited inside the
; library folder, which means a fresh checkout builds a black screen and the
; fix lives somewhere git will not track. LovyanGFX takes its config from
; ordinary source, so the panel definition sits in main.cpp where you can see
; it.
; ---------------------------------------------------------------------------
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800, not 921600. The CH340 bridge on this board drops bytes at the higher
; rate and esptool fails right after "Changing baud rate", with
;   Invalid head of packet (0x..): Possible serial noise or corruption
; which reads like a hardware fault and is only ever the cable and the clone
; bridge. Drop to 115200 if 460800 also fails; it is slow but it always works.
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
build_flags =
    -DLGFX_USE_V1
